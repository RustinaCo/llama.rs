[package]
name = "rust-llama"
version = "0.1.0"
edition = "2021"
description = "A lightweight, CPU-only LLM inference engine in Rust (llama.cpp-inspired)"
license = "MIT"
default-run = "rust-llama"

[[bin]]
name = "rust-llama"
path = "src/main.rs"

[lib]
name = "rust_llama"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
